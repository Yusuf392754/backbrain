<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackBrain — the memory that never lets go</title>
<meta name="description" content="BackBrain listens, remembers, and recalls — a calm memory assistant prototype.">
<meta name="theme-color" content="#1B2430">
<style>
  :root{
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --border:#DDE2E8;
    --bg:#F4F6F8;
    --paper:#FFFFFF;
    --accent:#C98A3B;
    --accent-light:#F3E3CB;
    --sage:#6F8F76;
    --sage-light:#E1EAE2;
    --danger:#C0392B;
    --you:#8BCFF2;
    --you-deep:#287EA8;
    --you-soft:#E5F6FD;
    --map-grid:rgba(40,126,168,.10);
    --radius:10px;
  }
  [data-theme="dark"]{
    --ink:#EAF1F6;
    --ink-soft:#AAB8C4;
    --border:#334452;
    --bg:#0D151C;
    --paper:#17232D;
    --accent:#E6B66C;
    --accent-light:#4A3924;
    --sage:#8EBB98;
    --sage-light:#213A2A;
    --danger:#FF8D82;
    --you:#8BD7FF;
    --you-deep:#4DB1DE;
    --you-soft:#173B4C;
    --map-grid:rgba(139,215,255,.13);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    transition:background .2s ease,color .2s ease;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    border-left:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .topbar .title{font-size:16px;font-weight:600;}
  .topbar button.icon-btn{
    background:none;border:none;cursor:pointer;font-size:18px;color:var(--ink-soft);
    padding:4px;line-height:1;
  }
  .screen{flex:1;overflow-y:auto;padding:16px;}
  h1.hero{font-size:20px;margin:0 0 4px;}
  p.sub{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}
  .ask-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .mic-btn{
    border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;
    background:var(--paper);color:var(--ink);font-size:12px;flex-shrink:0;padding:7px 10px;
  }
  .mic-btn.live{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ask-bar input{
    flex:1;border:1px solid var(--border);border-radius:var(--radius);
    padding:8px 10px;font-size:13px;
  }
  button{
    font-family:inherit;font-size:13px;padding:7px 12px;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--paper);color:var(--ink);cursor:pointer;
  }
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  button:hover{opacity:0.85;}
  .ask-log{margin:8px 0 16px;}
  .ask-entry{font-size:12px;padding:6px 0;border-top:1px solid var(--border);}
  .ask-entry .q{color:var(--ink-soft);}
  .stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;}
  .stat-card{background:var(--bg);border-radius:var(--radius);padding:10px;}
  .stat-card .label{font-size:11px;color:var(--ink-soft);}
  .stat-card .value{font-size:18px;font-weight:600;margin-top:2px;}
  .recap{background:var(--ink);color:#fff;border-radius:12px;padding:14px;margin-bottom:16px;}
  .recap .label{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.7;margin-bottom:6px;}
  .recap p{font-size:13px;line-height:1.5;margin:0;}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .section-head span.title{font-size:14px;font-weight:600;}
  .section-head button{font-size:12px;padding:5px 10px;}
  .card-row{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;}
  .card-row .text{font-size:13px;}
  .card-row .meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .card-row .actions{display:flex;gap:6px;margin-top:8px;}
  .empty{font-size:12px;color:var(--ink-soft);}
  .moments-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .moment-card{
    flex:0 0 130px;border:1px solid var(--border);border-radius:var(--radius);padding:10px;
  }
  .moment-card .time{font-size:10px;color:var(--accent);font-weight:600;}
  .moment-card .title{font-size:12px;font-weight:600;margin:4px 0 2px;}
  .moment-card .desc{font-size:11px;color:var(--ink-soft);}
  .timeline-row{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--border);}
  .timeline-row:first-child{border-top:none;}
  .timeline-row .t{font-size:11px;color:var(--ink-soft);width:56px;flex-shrink:0;}
  .timeline-row .title{font-size:13px;font-weight:600;}
  .timeline-row .desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .week-row{display:flex;gap:4px;margin-bottom:16px;}
  .day-cell{
    flex:1;text-align:center;padding:8px 2px;border:1px solid var(--border);border-radius:8px;
    cursor:pointer;font-size:11px;
  }
  .day-cell .num{font-size:14px;font-weight:600;display:block;margin-top:2px;}
  .day-cell.today{background:var(--accent-light);}
  .day-cell.selected{border-color:var(--accent);border-width:2px;}
  .day-cell .dot{width:4px;height:4px;border-radius:50%;background:var(--sage);margin:3px auto 0;}
  .week-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .week-nav button{padding:4px 8px;}
  .person-card{
    display:flex;gap:10px;border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 12px;margin-bottom:8px;align-items:flex-start;
  }
  .avatar{
    width:30px;height:30px;background:var(--bg);color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;
    border:1px solid var(--border);
  }
  .person-card .name{font-size:13px;font-weight:600;}
  .person-card .relation{font-size:11px;color:var(--accent);}
  .person-card .note{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .person-card .p-actions{margin-left:auto;display:flex;gap:4px;flex-shrink:0;}
  .person-card .p-actions button{padding:4px 6px;font-size:12px;}
  .bottom-mic{
    display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--border);
    flex-shrink:0;
  }
  .bottom-mic .status{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bottom-mic .stop-listening{padding:6px 8px;font-size:11px;white-space:nowrap;}
  .bottom-mic .stop-listening[disabled]{opacity:.45;cursor:not-allowed;}
  .you-intro{margin-bottom:10px;}
  .knowledge-map{position:relative;min-height:390px;margin:10px 0 16px;border:1px solid var(--border);border-radius:16px;background:radial-gradient(circle at center, var(--you-soft) 0 12%, var(--paper) 45%, var(--bg) 100%);overflow:hidden;perspective:900px;isolation:isolate;}
  .knowledge-map::before{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--map-grid) 1px,transparent 1px),linear-gradient(90deg,var(--map-grid) 1px,transparent 1px);background-size:26px 26px;opacity:.7;transform:perspective(700px) rotateX(58deg) scale(1.3);transform-origin:center bottom;pointer-events:none;}
  .knowledge-links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible;}
  .knowledge-links line{stroke:var(--you);stroke-width:1.2;stroke-dasharray:4 4;opacity:.55;}
  .knowledge-node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--border);background:var(--paper);color:var(--ink);border-radius:50%;font-size:11px;padding:8px;cursor:grab;box-shadow:0 8px 18px rgba(27,36,48,.16),inset 0 0 0 1px rgba(255,255,255,.16);transition:box-shadow .16s ease,border-color .16s ease;z-index:2;touch-action:none;user-select:none;}
  .knowledge-node:active{cursor:grabbing;}
  .knowledge-node:hover{border-color:var(--you);box-shadow:0 12px 24px rgba(40,126,168,.24);}
  .knowledge-node.selected{border:2px solid var(--you-deep);box-shadow:0 0 0 4px var(--you-soft),0 14px 30px rgba(40,126,168,.28);}
  .knowledge-node.center{left:50%;top:50%;width:102px;height:102px;transform:translate(-50%,-50%) translateZ(55px);background:var(--you);color:#0B2A38;border-color:var(--you-deep);font-size:15px;font-weight:700;z-index:3;cursor:pointer;}
  .knowledge-node.center:hover{transform:translate(-50%,-50%) translateZ(70px) scale(1.05);}
  .knowledge-node.topic{width:82px;height:82px;}
  .knowledge-node.custom{border-style:dashed;}
  .knowledge-node .node-z{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--you-deep);color:#fff;font-size:8px;line-height:14px;}
  .map-tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
  .map-tools button{font-size:11px;padding:5px 8px;}
  .map-hint{font-size:11px;color:var(--ink-soft);margin:0 0 8px;}
  .knowledge-detail{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--bg);font-size:12px;line-height:1.5;}
  .nav{display:flex;border-top:1px solid var(--border);flex-shrink:0;}
  .nav button{
    flex:1;border:none;background:none;border-radius:0;padding:10px 0;
    font-size:12px;color:var(--ink-soft);
  }
  .nav button.active{color:var(--accent);font-weight:600;}
  .settings-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--border);
  }
  .settings-row .st-title{font-size:13px;font-weight:600;}
  .settings-row .st-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;max-width:240px;}
  .price{font-size:28px;font-weight:700;margin:4px 0;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;
    justify-content:center;z-index:100;padding:20px;
  }
  .modal-box{
    background:var(--paper);border-radius:12px;padding:18px;width:100%;max-width:320px;
  }
  .modal-box h3{font-size:15px;margin:0 0 12px;}
  .modal-box label{font-size:12px;color:var(--ink-soft);display:block;margin:8px 0 4px;}
  .modal-box input{
    width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;
    font-size:13px;font-family:inherit;
  }
  .modal-btn-row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .error-text{font-size:12px;color:var(--danger);margin:6px 0 0;}
</style>
</head>
<body>

<div class="phone">
  <div class="topbar">
    <button class="icon-btn" id="backBtn" style="visibility:hidden;">back</button>
    <span class="title" id="topTitle">backbrain</span>
    <button class="icon-btn" id="settingsBtn">settings</button>
  </div>

  <div class="screen" id="screenContent"></div>

  <div class="bottom-mic" id="bottomMic">
    <button class="mic-btn" id="micBtn">start listening</button>
    <button class="stop-listening" id="stopListeningBtn" disabled>turn off listening</button>
    <span class="status" id="voiceStatus">voice off — press start listening</span>
  </div>

  <div class="nav" id="bottomNav">
    <button data-tab="home">home</button>
    <button data-tab="timeline">timeline</button>
    <button data-tab="calendar">calendar</button>
    <button data-tab="people">people</button>
    <button data-tab="you">you</button>
  </div>
</div>

<script>
// ---------- state ----------
let currentScreen = 'home';
let currentTab = 'home';

let nextInboxId = 2;
let inbox = [
  {id:1, text:'follow-up bloodwork', meta:'detected from dr. patel visit · suggested: 3 weeks from today'}
];

let nextEventId = 1;
let events = {}; // key: 'YYYY-M-D' -> [{id,text,time,source}]

let people = [
  {name:'sarah', relation:'daughter', note:'visits most weekends, usually calls first.'},
  {name:'michael', relation:'son', note:'calls to check in, brings the kids over for dinner.'},
  {name:'dr. patel', relation:'physician', note:'manages medication.'},
  {name:'pat', relation:'neighbor', note:'stops by for coffee.'}
];

const moments = [
  {time:'7:30 am', title:'woke up', desc:'morning medication taken on schedule.'},
  {time:'9:00 am', title:'coffee with pat', desc:'neighbor stopped by.'},
  {time:'11:00 am', title:'call with michael', desc:"confirmed saturday's visit."},
  {time:'2:15 pm', title:'dr. patel visit', desc:'medication dose adjusted.'},
  {time:'6:30 pm', title:'family dinner', desc:'michael and the kids came by.'}
];

const ASK_LOG_KEY = 'backbrain_ask_log';
let askLog = loadAskLog();
let selectedDay = dateOnly(new Date());
let weekStart = startOfWeek(new Date());

let notificationsEnabled = true;
let caregiverShare = false;
let isSubscribed = false;
let theme = 'light';
let nextNodeId = 6;
let knowledgeNodes = [
  {id:'friends', label:'friends', detail:'People in your circle and the context you have saved about them.', x:16, y:20, z:10, color:'#F4FBFF', locked:false},
  {id:'passwords', label:'passwords', detail:'No real passwords are stored in this static prototype. Use a dedicated password manager.', x:78, y:20, z:14, color:'#F4FBFF', locked:false},
  {id:'health', label:'health', detail:'Health reminders and notes should be protected in a real medical record.', x:16, y:76, z:8, color:'#F4FBFF', locked:false},
  {id:'schedule', label:'schedule', detail:'Calendar events and reminders currently saved in this browser.', x:78, y:76, z:12, color:'#F4FBFF', locked:false},
  {id:'memories', label:'memories', detail:'Moments captured in your timeline and future user-authored memories.', x:50, y:11, z:18, color:'#F4FBFF', locked:false}
];

const STATE_KEY = 'backbrain_state_v1';

// ---------- date helpers ----------
function dateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function startOfWeek(d){ const x = dateOnly(d); x.setDate(x.getDate() - x.getDay()); return x; }
function dateKey(d){ return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function eventsFor(d){ return events[dateKey(d)] || []; }
const dayNames = ['sun','mon','tue','wed','thu','fri','sat'];
const monthNames = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

function loadAskLog(){
  try{
    const saved = JSON.parse(localStorage.getItem(ASK_LOG_KEY) || '[]');
    return Array.isArray(saved) ? saved.filter(e => e && e.q && e.a).slice(0,20) : [];
  }catch(e){ return []; }
}

function saveState(){
  try{
    const snapshot = {
      version: 1,
      nextInboxId,
      nextEventId,
      inbox,
      events,
      people,
      askLog: askLog.slice(0,20),
      notificationsEnabled,
      caregiverShare,
      isSubscribed,
      theme,
      nextNodeId,
      knowledgeNodes
    };
    localStorage.setItem(STATE_KEY, JSON.stringify(snapshot));
    localStorage.setItem(ASK_LOG_KEY, JSON.stringify(snapshot.askLog));
  }catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (Array.isArray(saved.inbox)) inbox = saved.inbox;
    if (saved.events && typeof saved.events === 'object' && !Array.isArray(saved.events)) events = saved.events;
    if (Array.isArray(saved.people)) people = saved.people;
    if (Array.isArray(saved.askLog)) askLog = saved.askLog.filter(e => e && e.q && e.a).slice(0,20);
    if (Number.isInteger(saved.nextInboxId)) nextInboxId = saved.nextInboxId;
    if (Number.isInteger(saved.nextEventId)) nextEventId = saved.nextEventId;
    if (typeof saved.notificationsEnabled === 'boolean') notificationsEnabled = saved.notificationsEnabled;
    if (typeof saved.caregiverShare === 'boolean') caregiverShare = saved.caregiverShare;
    if (typeof saved.isSubscribed === 'boolean') isSubscribed = saved.isSubscribed;
    if (saved.theme === 'light' || saved.theme === 'dark') theme = saved.theme;
    if (Number.isInteger(saved.nextNodeId)) nextNodeId = saved.nextNodeId;
    if (Array.isArray(saved.knowledgeNodes)) knowledgeNodes = saved.knowledgeNodes.filter(n => n && n.id && n.label && !n.locked);
  }catch(e){}
}

function saveAskLog(){ saveState(); }

loadState();

function applyTheme(){
  document.documentElement.dataset.theme = theme;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = theme === 'dark' ? '#0D151C' : '#E5F6FD';
}

// ---------- modal helper ----------
function showModal(title, fields){
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    const h3 = document.createElement('h3');
    h3.textContent = title;
    box.appendChild(h3);

    const inputs = {};
    fields.forEach(f => {
      const label = document.createElement('label');
      label.textContent = f.label;
      const input = document.createElement('input');
      input.type = f.type || 'text';
      input.placeholder = f.placeholder || '';
      input.value = f.value || '';
      inputs[f.key] = input;
      box.appendChild(label);
      box.appendChild(input);
    });

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'cancel';
    cancelBtn.onclick = () => { document.body.removeChild(overlay); resolve(null); };
    const okBtn = document.createElement('button');
    okBtn.textContent = 'save';
    okBtn.className = 'primary';
    okBtn.onclick = () => {
      const values = {};
      fields.forEach(f => values[f.key] = inputs[f.key].value.trim());
      document.body.removeChild(overlay);
      resolve(values);
    };
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(okBtn);
    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const firstInput = inputs[fields[0].key];
    if (firstInput) firstInput.focus();
  });
}

// ---------- ask backbrain ----------
function answerFor(question){
  const q = question.toLowerCase();

  for (const p of people){
    if (q.includes(p.name)) return `${p.name} is your ${p.relation}. ${p.note}`;
  }
  if (q.includes('doctor') || q.includes('medication') || q.includes('dose')){
    const doc = people.find(p => p.relation.includes('physician'));
    if (doc) return doc.note;
  }
  if (q.includes('schedule') || q.includes('need') || q.includes('todo')){
    if (inbox.length === 0) return 'nothing is waiting to be scheduled right now.';
    return `you have ${inbox.length} thing(s) waiting, including "${inbox[0].text}."`;
  }
  if (q.includes('today')){
    const todays = eventsFor(new Date());
    if (todays.length === 0) return 'nothing else is scheduled for today.';
    return `today you've got: ${todays.map(e => e.text).join(', ')}.`;
  }
  return "here's what i caught today: coffee with pat, a call with michael, dr. patel's visit, and family dinner.";
}

function askQuestion(text){
  if (!text || !text.trim()) return;
  const answer = answerFor(text);
  askLog.unshift({q: text.trim(), a: answer});
  if (askLog.length > 20) askLog.pop();
  saveAskLog();
  if ('speechSynthesis' in window){
    const utter = new SpeechSynthesisUtterance(answer);
    utter.rate = 1;
    window.speechSynthesis.speak(utter);
  }
  render();
}

// ---------- voice ("hey backbrain") ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let awaitingCommand = false;
let voiceStatusText = 'voice off — press start listening';
let selectedKnowledge = 'overview';
let lastVoiceAnswer = '';

function setVoiceStatus(text){
  voiceStatusText = text;
  const el = document.getElementById('voiceStatus');
  if (el) el.textContent = text;
}

function speakText(text){
  lastVoiceAnswer = text;
  if ('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1;
    window.speechSynthesis.speak(utter);
  }
}

function voiceAction(message){
  setVoiceStatus(message);
  speakText(message);
}

function addVoiceReminder(text){
  const clean = text.trim();
  if (!clean) return voiceAction('tell me what to remember.');
  inbox.push({id: nextInboxId++, text: clean, meta: 'added by voice'});
  saveState();
  goToTab('home');
  voiceAction(`remembered: ${clean}`);
}

function addVoiceEvent(text){
  const clean = text.trim();
  if (!clean) return voiceAction('tell me the event to add.');
  const key = dateKey(selectedDay);
  if (!events[key]) events[key] = [];
  events[key].push({id: nextEventId++, text: clean, time: 'time tbd', source:'you'});
  saveState();
  goToTab('calendar');
  voiceAction(`added ${clean} to your calendar.`);
}

function deleteVoiceEvent(text){
  const clean = text.trim().toLowerCase();
  const key = dateKey(selectedDay);
  const match = (events[key] || []).find(e => e.text.toLowerCase().includes(clean));
  if (!match) return voiceAction(`i couldn't find ${text.trim()} on the selected day.`);
  events[key] = events[key].filter(e => e.id !== match.id);
  if (events[key].length === 0) delete events[key];
  saveState();
  render();
  voiceAction(`deleted ${match.text} from your calendar.`);
}

function handleVoiceCommand(raw){
  const text = raw.toLowerCase().trim();
  if (!text) return;
  if (text === 'turn off listening' || text === 'stop listening' || text === 'stop listening now'){
    stopListening();
    return;
  }
  if (text === 'turn on listening' || text === 'start listening'){
    startListening();
    return;
  }
  if (text === 'go home' || text === 'show home'){
    goToTab('home');
    return voiceAction('home.');
  }
  if (text.startsWith('remember ') || text.startsWith('add reminder ')){
    return addVoiceReminder(text.replace(/^add reminder |^remember /, ''));
  }
  if (text.startsWith('add event ') || text.startsWith('schedule ')){
    return addVoiceEvent(text.replace(/^add event |^schedule /, ''));
  }
  if (text.startsWith('delete event ') || text.startsWith('remove event ')){
    return deleteVoiceEvent(text.replace(/^delete event |^remove event /, ''));
  }
  if (text.includes('calendar') || text.includes('schedule')){
    goToTab('calendar');
    return voiceAction('calendar.');
  }
  if (text.includes('timeline')){
    goToTab('timeline');
    return voiceAction('timeline.');
  }
  if (text.includes('people') || text.includes('who is')){
    goToTab('people');
    return voiceAction('people.');
  }
  if (text.includes('you map') || text === 'show you' || text === 'open you' || text.includes('knowledge map')){
    goToTab('you');
    return voiceAction('your knowledge map.');
  }
  const topic = ['friends','passwords','health','schedule','memories'].find(name => text.includes(name));
  if (topic && (text.includes('show') || text.includes('open') || text.includes('tell me'))){
    selectedKnowledge = topic;
    goToTab('you');
    return voiceAction(`${topic}.`);
  }
  if (text === 'repeat that' || text === 'repeat'){
    return voiceAction(lastVoiceAnswer || 'there is nothing to repeat yet.');
  }
  askQuestion(text);
}

function handleTranscript(raw){
  let text = raw.toLowerCase().trim();
  if (!text) return;
  const wake = 'hey backbrain';
  const hasWake = text.includes(wake);
  if (hasWake) text = text.split(wake).slice(1).join(wake).trim();
  if (text === 'turn off listening' || text === 'stop listening') return handleVoiceCommand(text);
  if (awaitingCommand){
    awaitingCommand = false;
    handleVoiceCommand(text);
    return;
  }
  if (hasWake){
    if (text.length > 1) handleVoiceCommand(text);
    else {
      awaitingCommand = true;
      setVoiceStatus('listening for your command...');
    }
  }
}

function startListening(){
  if (!SpeechRecognition){
    setVoiceStatus("voice isn't supported in this browser — try chrome, over https.");
    return;
  }
  if (!recognition){
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
    recognition.onresult = (e) => {
      const last = e.results[e.results.length - 1];
      if (last.isFinal) handleTranscript(last[0].transcript);
    };
    recognition.onerror = (e) => {
      setVoiceStatus('mic error: ' + e.error);
      listening = false;
      updateMicBtn();
    };
    recognition.onend = () => { if (listening){ try{ recognition.start(); }catch(e){} } };
  }
  try{
    recognition.start();
    listening = true;
    setVoiceStatus('listening — say “hey backbrain” then a command.');
    updateMicBtn();
  }catch(e){
    setVoiceStatus('could not start the mic.');
  }
}

function stopListening(){
  listening = false;
  if (recognition) recognition.stop();
  awaitingCommand = false;
  setVoiceStatus('voice off — press start listening');
  updateMicBtn();
}

function updateMicBtn(){
  const btn = document.getElementById('micBtn');
  const stopBtn = document.getElementById('stopListeningBtn');
  if (btn){
    btn.classList.toggle('live', listening);
    btn.textContent = listening ? 'listening' : 'start listening';
  }
  if (stopBtn){
    stopBtn.disabled = !listening;
    stopBtn.textContent = 'turn off listening';
  }
}

function updateNodePosition(id, event){

  node.x = clamp(((event.clientX - rect.left) / rect.width) * 100, 5, 95);

  if (el){ el.style.left = `${node.x}%`; el.style.top = `${node.y}%`; }

// ---------- wire events per screen ----------
function wireScreenEvents(){
  const askBtn = document.getElementById('askBtn');
  const askInput = document.getElementById('askInput');
  if (askBtn) askBtn.onclick = () => { askQuestion(askInput.value); askInput.value=''; };
  if (askInput) askInput.onkeydown = (e) => { if (e.key==='Enter'){ askQuestion(askInput.value); askInput.value=''; } };

  const addReminderBtn = document.getElementById('addReminderBtn');
  if (addReminderBtn) addReminderBtn.onclick = addReminder;
  document.querySelectorAll('[data-edit-reminder]').forEach(b => b.onclick = () => editReminder(parseInt(b.dataset.editReminder)));
  document.querySelectorAll('[data-confirm-reminder]').forEach(b => b.onclick = () => confirmReminder(parseInt(b.dataset.confirmReminder)));

  document.querySelectorAll('[data-day]').forEach(cell => cell.onclick = () => { selectedDay = dateOnly(new Date(cell.dataset.day)); render(); });
  const prevWeekBtn = document.getElementById('prevWeekBtn');
  const nextWeekBtn = document.getElementById('nextWeekBtn');
  if (prevWeekBtn) prevWeekBtn.onclick = () => { weekStart.setDate(weekStart.getDate()-7); selectedDay = new Date(weekStart); render(); };
  if (nextWeekBtn) nextWeekBtn.onclick = () => { weekStart.setDate(weekStart.getDate()+7); selectedDay = new Date(weekStart); render(); };
  const addEventBtn = document.getElementById('addEventBtn');
  if (addEventBtn) addEventBtn.onclick = addEvent;
  document.querySelectorAll('[data-remove-event]').forEach(b => b.onclick = () => removeEvent(parseInt(b.dataset.removeEvent)));

  const addPersonBtn = document.getElementById('addPersonBtn');
  if (addPersonBtn) addPersonBtn.onclick = addPerson;
  document.querySelectorAll('[data-edit-person]').forEach(b => b.onclick = () => editPerson(parseInt(b.dataset.editPerson)));
  document.querySelectorAll('[data-remove-person]').forEach(b => b.onclick = () => removePerson(parseInt(b.dataset.removePerson)));
  document.querySelectorAll('[data-knowledge]').forEach(b => b.onclick = () => { selectedKnowledge = b.dataset.knowledge; render(); });

  const addKnowledgeBtn = document.getElementById('addKnowledgeBtn');
  if (addKnowledgeBtn) addKnowledgeBtn.onclick = addKnowledgeNode;
  const resetMapBtn = document.getElementById('resetMapBtn');
  if (resetMapBtn) resetMapBtn.onclick = resetKnowledgeLayout;
  const editKnowledgeBtn = document.getElementById('editKnowledgeBtn');
  if (editKnowledgeBtn && selectedKnowledge !== 'overview') editKnowledgeBtn.onclick = () => editKnowledgeNode(selectedKnowledge);
  const removeKnowledgeBtn = document.getElementById('removeKnowledgeBtn');
  if (removeKnowledgeBtn && selectedKnowledge !== 'overview') removeKnowledgeBtn.onclick = () => removeKnowledgeNode(selectedKnowledge);
  document.querySelectorAll('[data-drag-node]').forEach(nodeEl => {
    nodeEl.addEventListener('pointerdown', (event) => {
      draggingNodeId = nodeEl.dataset.dragNode;
      nodeEl.setPointerCapture(event.pointerId);
      selectedKnowledge = draggingNodeId;
      nodeEl.classList.add('selected');
    });
    nodeEl.addEventListener('pointermove', (event) => { if (draggingNodeId === nodeEl.dataset.dragNode) updateNodePosition(draggingNodeId, event); });
    nodeEl.addEventListener('pointerup', () => { if (draggingNodeId === nodeEl.dataset.dragNode){ draggingNodeId = null; saveState(); render(); } });
    nodeEl.addEventListener('click', () => { if (!draggingNodeId) { selectedKnowledge = nodeEl.dataset.dragNode; render(); } });
  });

  const subRow = document.getElementById('subRow');
  if (subRow) subRow.onclick = () => goToScreen('subscription');
  const themeSwitch = document.getElementById('themeSwitch');
  if (themeSwitch) themeSwitch.onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); saveState(); render(); };
  const notifSwitch = document.getElementById('notifSwitch');
  if (notifSwitch) notifSwitch.onclick = () => { notificationsEnabled = !notificationsEnabled; saveState(); render(); };
  const caregiverSwitch = document.getElementById('caregiverSwitch');
  if (caregiverSwitch) caregiverSwitch.onclick = () => { caregiverShare = !caregiverShare; saveState(); render(); };
  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.onclick = () => {
    nextInboxId = 2;
    nextEventId = 1;
    inbox = [{id:1, text:'follow-up bloodwork', meta:'detected from dr. patel visit · suggested: 3 weeks from today'}];
    events = {};
    people = [
      {name:'sarah', relation:'daughter', note:'visits most weekends, usually calls first.'},
      {name:'michael', relation:'son', note:'calls to check in, brings the kids over for dinner.'},
      {name:'dr. patel', relation:'physician', note:'manages medication.'},
      {name:'pat', relation:'neighbor', note:'stops by for coffee.'}
    ];
    askLog = [];
    notificationsEnabled = true;
    caregiverShare = false;
    isSubscribed = false;
    theme = 'light';
    knowledgeNodes = [
      {id:'friends', label:'friends', detail:'People in your circle and the context you have saved about them.', x:16, y:20, z:10, color:'#F4FBFF', locked:false},
      {id:'passwords', label:'passwords', detail:'No real passwords are stored in this static prototype. Use a dedicated password manager.', x:78, y:20, z:14, color:'#F4FBFF', locked:false},
      {id:'health', label:'health', detail:'Health reminders and notes should be protected in a real medical record.', x:16, y:76, z:8, color:'#F4FBFF', locked:false},
      {id:'schedule', label:'schedule', detail:'Calendar events and reminders currently saved in this browser.', x:78, y:76, z:12, color:'#F4FBFF', locked:false},
      {id:'memories', label:'memories', detail:'Moments captured in your timeline and future user-authored memories.', x:50, y:11, z:18, color:'#F4FBFF', locked:false}
    ];
    nextNodeId = 6;
    applyTheme();
    saveState();
    render();
  };

  const subscribeBtn = document.getElementById('subscribeBtn');
  if (subscribeBtn) subscribeBtn.onclick = () => {
    const email = document.getElementById('subEmail').value.trim();
    const errEl = document.getElementById('subError');
    if (!email || !email.includes('@')){
      errEl.textContent = 'enter a valid email first.';
      errEl.style.display = 'block';
      return;
    }
    isSubscribed = true;
    saveState();
    render();
  };
  const cancelSubBtn = document.getElementById('cancelSubBtn');
  if (cancelSubBtn) cancelSubBtn.onclick = () => { isSubscribed = false; saveState(); render(); };
}

// ---------- top-level wiring ----------
document.getElementById('settingsBtn').onclick = () => goToScreen('settings');
document.getElementById('backBtn').onclick = () => {
  if (currentScreen === 'subscription') goToScreen('settings');
  else goToScreen(currentTab);
};
document.querySelectorAll('#bottomNav button').forEach(btn => btn.onclick = () => goToTab(btn.dataset.tab));
document.getElementById('micBtn').onclick = () => { listening ? stopListening() : startListening(); };
document.getElementById('stopListeningBtn').onclick = () => stopListening();
window.addEventListener('storage', (event) => { if (event.key === STATE_KEY){ loadState(); applyTheme(); render(); } });

applyTheme();
render();
setInterval(() => { if (currentScreen === 'you' && !draggingNodeId) render(); }, 2000);
</script>

</body>
</html>
