<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackBrain — the memory that never lets go</title>
<meta name="description" content="BackBrain listens, remembers, and recalls — a calm memory assistant prototype.">
<meta name="theme-color" content="#1B2430">
<style>
  :root{
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --border:#DDE2E8;
    --bg:#F4F6F8;
    --paper:#FFFFFF;
    --accent:#C98A3B;
    --accent-light:#F3E3CB;
    --sage:#6F8F76;
    --sage-light:#E1EAE2;
    --danger:#C0392B;
    --you:#8BCFF2;
    --you-deep:#287EA8;
    --you-soft:#E5F6FD;
    --map-grid:rgba(40,126,168,.10);
    --radius:10px;
  }
  [data-theme="dark"]{
    --ink:#EAF1F6;
    --ink-soft:#AAB8C4;
    --border:#334452;
    --bg:#0D151C;
    --paper:#17232D;
    --accent:#E6B66C;
    --accent-light:#4A3924;
    --sage:#8EBB98;
    --sage-light:#213A2A;
    --danger:#FF8D82;
    --you:#8BD7FF;
    --you-deep:#4DB1DE;
    --you-soft:#173B4C;
    --map-grid:rgba(139,215,255,.13);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    transition:background .2s ease,color .2s ease;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    border-left:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .topbar .title{font-size:16px;font-weight:600;}
  .topbar button.icon-btn{
    background:none;border:none;cursor:pointer;font-size:18px;color:var(--ink-soft);
    padding:4px;line-height:1;
  }
  .screen{flex:1;overflow-y:auto;padding:16px;}
  h1.hero{font-size:20px;margin:0 0 4px;}
  p.sub{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}
  .ask-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .mic-btn{
    border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;
    background:var(--paper);color:var(--ink);font-size:12px;flex-shrink:0;padding:7px 10px;
  }
  .mic-btn.live{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ask-bar input{
    flex:1;border:1px solid var(--border);border-radius:var(--radius);
    padding:8px 10px;font-size:13px;
  }
  button{
    font-family:inherit;font-size:13px;padding:7px 12px;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--paper);color:var(--ink);cursor:pointer;
  }
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  button:hover{opacity:0.85;}
  .ask-log{margin:8px 0 16px;}
  .ask-entry{font-size:12px;padding:6px 0;border-top:1px solid var(--border);}
  .ask-entry .q{color:var(--ink-soft);}
  .stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;}
  .stat-card{background:var(--bg);border-radius:var(--radius);padding:10px;}
  .stat-card .label{font-size:11px;color:var(--ink-soft);}
  .stat-card .value{font-size:18px;font-weight:600;margin-top:2px;}
  .recap{background:var(--ink);color:#fff;border-radius:12px;padding:14px;margin-bottom:16px;}
  .recap .label{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.7;margin-bottom:6px;}
  .recap p{font-size:13px;line-height:1.5;margin:0;}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .section-head span.title{font-size:14px;font-weight:600;}
  .section-head button{font-size:12px;padding:5px 10px;}
  .card-row{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;}
  .card-row .text{font-size:13px;}
  .card-row .meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .card-row .actions{display:flex;gap:6px;margin-top:8px;}
  .empty{font-size:12px;color:var(--ink-soft);}
  .moments-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .moment-card{
    flex:0 0 130px;border:1px solid var(--border);border-radius:var(--radius);padding:10px;
  }
  .moment-card .time{font-size:10px;color:var(--accent);font-weight:600;}
  .moment-card .title{font-size:12px;font-weight:600;margin:4px 0 2px;}
  .moment-card .desc{font-size:11px;color:var(--ink-soft);}
  .timeline-row{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--border);}
  .timeline-row:first-child{border-top:none;}
  .timeline-row .t{font-size:11px;color:var(--ink-soft);width:56px;flex-shrink:0;}
  .timeline-row .title{font-size:13px;font-weight:600;}
  .timeline-row .desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .week-row{display:flex;gap:4px;margin-bottom:16px;}
  .day-cell{
    flex:1;text-align:center;padding:8px 2px;border:1px solid var(--border);border-radius:8px;
    cursor:pointer;font-size:11px;
  }
  .day-cell .num{font-size:14px;font-weight:600;display:block;margin-top:2px;}
  .day-cell.today{background:var(--accent-light);}
  .day-cell.selected{border-color:var(--accent);border-width:2px;}
  .day-cell .dot{width:4px;height:4px;border-radius:50%;background:var(--sage);margin:3px auto 0;}
  .week-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .week-nav button{padding:4px 8px;}
  .person-card{
    display:flex;gap:10px;border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 12px;margin-bottom:8px;align-items:flex-start;
  }
  .avatar{
    width:30px;height:30px;background:var(--bg);color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;
    border:1px solid var(--border);
  }
  .person-card .name{font-size:13px;font-weight:600;}
  .person-card .relation{font-size:11px;color:var(--accent);}
  .person-card .note{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .person-card .p-actions{margin-left:auto;display:flex;gap:4px;flex-shrink:0;}
  .person-card .p-actions button{padding:4px 6px;font-size:12px;}
  .bottom-mic{
    display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--border);
    flex-shrink:0;
  }
  .bottom-mic .status{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bottom-mic .stop-listening{padding:6px 8px;font-size:11px;white-space:nowrap;}
  .bottom-mic .stop-listening[disabled]{opacity:.45;cursor:not-allowed;}
  .you-intro{margin-bottom:10px;}
  .knowledge-map{position:relative;min-height:420px;margin:10px 0 16px;border:1px solid var(--border);border-radius:16px;background:radial-gradient(circle at 50% 45%,var(--you-soft),var(--paper) 48%,var(--bg));overflow:hidden;touch-action:none;cursor:grab;box-shadow:inset 0 0 50px rgba(40,126,168,.12);}
  .knowledge-map:active{cursor:grabbing;}
  .knowledge-canvas{display:block;width:100%;height:420px;}
  .graph-hud{position:absolute;left:10px;top:10px;font-size:10px;color:var(--ink-soft);background:color-mix(in srgb,var(--paper) 82%,transparent);padding:5px 7px;border:1px solid var(--border);border-radius:8px;pointer-events:none;backdrop-filter:blur(6px);}
  .graph-legend{position:absolute;right:10px;bottom:10px;font-size:10px;color:var(--ink-soft);background:color-mix(in srgb,var(--paper) 82%,transparent);padding:5px 7px;border:1px solid var(--border);border-radius:8px;pointer-events:none;}
  .map-tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
  .map-tools button{font-size:11px;padding:5px 8px;}
  .map-hint{font-size:11px;color:var(--ink-soft);margin:0 0 8px;}
  .knowledge-detail{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--bg);font-size:12px;line-height:1.5;}
  .topic-card{max-width:360px;max-height:72vh;overflow:auto;}
  .topic-card .topic-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .topic-card .topic-card-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--you-deep);font-weight:700;}
  .topic-card .topic-card-desc{font-size:12px;color:var(--ink-soft);line-height:1.45;margin:10px 0;}
  .topic-items{display:grid;gap:6px;margin:10px 0;}
  .topic-item{border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--bg);font-size:12px;line-height:1.35;}
  .topic-item small{display:block;color:var(--ink-soft);font-size:10px;margin-top:3px;}
  .topic-card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .nav{display:flex;border-top:1px solid var(--border);flex-shrink:0;}
  .nav button{
    flex:1;border:none;background:none;border-radius:0;padding:10px 0;
    font-size:12px;color:var(--ink-soft);
  }
  .nav button.active{color:var(--accent);font-weight:600;}
  .settings-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--border);
  }
  .settings-row .st-title{font-size:13px;font-weight:600;}
  .settings-row .st-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;max-width:240px;}
  .price{font-size:28px;font-weight:700;margin:4px 0;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;
    justify-content:center;z-index:100;padding:20px;
  }
  .modal-box{
    background:var(--paper);border-radius:12px;padding:18px;width:100%;max-width:320px;
  }
  .modal-box h3{font-size:15px;margin:0 0 12px;}
  .modal-box label{font-size:12px;color:var(--ink-soft);display:block;margin:8px 0 4px;}
  .modal-box input{
    width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;
    font-size:13px;font-family:inherit;
  }
  .modal-btn-row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .error-text{font-size:12px;color:var(--danger);margin:6px 0 0;}
</style>
</head>
<body>

<div class="phone">
  <div class="topbar">
    <button class="icon-btn" id="backBtn" style="visibility:hidden;">back</button>
    <span class="title" id="topTitle">backbrain</span>
    <button class="icon-btn" id="settingsBtn">settings</button>
  </div>

  <div class="screen" id="screenContent"></div>

  <div class="bottom-mic" id="bottomMic">
    <button class="mic-btn" id="micBtn">start listening</button>
    <button class="stop-listening" id="stopListeningBtn" disabled>turn off listening</button>
    <span class="status" id="voiceStatus">voice off — press start listening</span>
  </div>

  <div class="nav" id="bottomNav">
    <button data-tab="home">home</button>
    <button data-tab="timeline">timeline</button>
    <button data-tab="calendar">calendar</button>
    <button data-tab="people">people</button>
    <button data-tab="you">you</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ---------- state ----------
let currentScreen = 'home';
let currentTab = 'home';
let mockDataEnabled = new URLSearchParams(window.location.search).get('demo') === '1';
let supabaseClient = null;
let authUser = null;

let nextInboxId = 1;
let inbox = [];

let nextEventId = 1;
let events = {}; // key: 'YYYY-M-D' -> [{id,text,time,source}]

let people = [];
let moments = [];

const ASK_LOG_KEY = 'backbrain_ask_log_v2';
let askLog = loadAskLog();
let selectedDay = dateOnly(new Date());
let weekStart = startOfWeek(new Date());

let notificationsEnabled = true;
let caregiverShare = false;
let isSubscribed = false;
let theme = 'light';
let graphAutoNodes = true;
let topicCardId = null;
let nextNodeId = 6;
let knowledgeNodes = [
  {id:'friends', label:'friends', detail:'People in your circle and the context you have saved about them.', x:16, y:20, z:10, color:'#F4FBFF', locked:false, items:[]},
  {id:'passwords', label:'passwords', detail:'No real passwords are stored in this static prototype. Use a dedicated password manager.', x:78, y:20, z:14, color:'#F4FBFF', locked:false, items:[]},
  {id:'health', label:'health', detail:'Health reminders and notes should be protected in a real medical record.', x:16, y:76, z:8, color:'#F4FBFF', locked:false, items:[]},
  {id:'schedule', label:'schedule', detail:'Calendar events and reminders currently saved in this browser.', x:78, y:76, z:12, color:'#F4FBFF', locked:false, items:[]},
  {id:'memories', label:'memories', detail:'Moments captured in your timeline and future user-authored memories.', x:50, y:11, z:18, color:'#F4FBFF', locked:false, items:[]}
];

const STATE_KEY = 'backbrain_state_v2';

// ---------- date helpers ----------
function dateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function startOfWeek(d){ const x = dateOnly(d); x.setDate(x.getDate() - x.getDay()); return x; }
function dateKey(d){ return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function eventsFor(d){ return events[dateKey(d)] || []; }
const dayNames = ['sun','mon','tue','wed','thu','fri','sat'];
const monthNames = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

function loadAskLog(){
  try{
    const saved = JSON.parse(localStorage.getItem(ASK_LOG_KEY) || '[]');
    return Array.isArray(saved) ? saved.filter(e => e && e.q && e.a).slice(0,20) : [];
  }catch(e){ return []; }
}

function saveState(){
  try{
    const snapshot = {
      version: 1,
      nextInboxId,
      nextEventId,
      inbox,
      events,
      people,
      moments,
      mockDataEnabled,
      askLog: askLog.slice(0,20),
      notificationsEnabled,
      caregiverShare,
      isSubscribed,
      theme,
      graphAutoNodes,
      nextNodeId,
      knowledgeNodes
    };
    localStorage.setItem(STATE_KEY, JSON.stringify(snapshot));
    localStorage.setItem(ASK_LOG_KEY, JSON.stringify(snapshot.askLog));
  }catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (Array.isArray(saved.inbox)) inbox = saved.inbox;
    if (saved.events && typeof saved.events === 'object' && !Array.isArray(saved.events)) events = saved.events;
    if (Array.isArray(saved.people)) people = saved.people;
    if (Array.isArray(saved.moments)) moments = saved.moments;
    if (typeof saved.mockDataEnabled === 'boolean') mockDataEnabled = saved.mockDataEnabled;
    if (Array.isArray(saved.askLog)) askLog = saved.askLog.filter(e => e && e.q && e.a).slice(0,20);
    if (Number.isInteger(saved.nextInboxId)) nextInboxId = saved.nextInboxId;
    if (Number.isInteger(saved.nextEventId)) nextEventId = saved.nextEventId;
    if (typeof saved.notificationsEnabled === 'boolean') notificationsEnabled = saved.notificationsEnabled;
    if (typeof saved.caregiverShare === 'boolean') caregiverShare = saved.caregiverShare;
    if (typeof saved.isSubscribed === 'boolean') isSubscribed = saved.isSubscribed;
    if (saved.theme === 'light' || saved.theme === 'dark') theme = saved.theme;
    if (typeof saved.graphAutoNodes === 'boolean') graphAutoNodes = saved.graphAutoNodes;
    if (Number.isInteger(saved.nextNodeId)) nextNodeId = saved.nextNodeId;
    if (Array.isArray(saved.knowledgeNodes)) knowledgeNodes = saved.knowledgeNodes.filter(n => n && n.id && n.label && !n.locked).map(n => ({...n, items:Array.isArray(n.items) ? n.items.slice(0,30) : []}));
  }catch(e){}
}

function saveAskLog(){ saveState(); }

loadState();
if (mockDataEnabled && !inbox.length && !people.length && !moments.length) loadPersonalizedMockData();

function applyTheme(){
  document.documentElement.dataset.theme = theme;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = theme === 'dark' ? '#0D151C' : '#E5F6FD';
}

// ---------- modal helper ----------
function showModal(title, fields){
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    const h3 = document.createElement('h3');
    h3.textContent = title;
    box.appendChild(h3);

    const inputs = {};
    fields.forEach(f => {
      const label = document.createElement('label');
      label.textContent = f.label;
      const input = document.createElement('input');
      input.type = f.type || 'text';
      input.placeholder = f.placeholder || '';
      input.value = f.value || '';
      inputs[f.key] = input;
      box.appendChild(label);
      box.appendChild(input);
    });

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'cancel';
    cancelBtn.onclick = () => { document.body.removeChild(overlay); resolve(null); };
    const okBtn = document.createElement('button');
    okBtn.textContent = 'save';
    okBtn.className = 'primary';
    okBtn.onclick = () => {
      const values = {};
      fields.forEach(f => values[f.key] = inputs[f.key].value.trim());
      document.body.removeChild(overlay);
      resolve(values);
    };
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(okBtn);
    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const firstInput = inputs[fields[0].key];
    if (firstInput) firstInput.focus();
  });
}

// ---------- production API boundary ----------
async function apiHeaders(){
  let token = '';
  if (supabaseClient){
    const sessionResult = await supabaseClient.auth.getSession();
    token = sessionResult.data.session?.access_token || '';
  }
  return {'Content-Type':'application/json', ...(token ? {'Authorization':`Bearer ${token}`} : {})};
}
function memoryContext(){
  return JSON.stringify({
    reminders: inbox,
    events,
    people,
    recentAnswers: askLog.slice(0,10),
    moments,
    knowledge: knowledgeNodes.map(n => ({label:n.label, detail:n.detail, items:n.items || []}))
  });
}
async function apiRequest(path, options={}){
  const response = await fetch(path, {headers:await apiHeaders(), ...options});
  let payload = null;
  try { payload = await response.json(); } catch(e){}
  if (!response.ok) throw new Error(payload?.detail || payload?.error || `request failed (${response.status})`);
  return payload;
}

// ---------- ask backbrain ----------
async function askQuestion(text){
  if (!text || !text.trim()) return;
  let answer;
  if (mockDataEnabled) {
    answer = demoAnswerFor(text.trim());
  } else try {
    const result = await apiRequest('/api/ask', {method:'POST', body:JSON.stringify({question:text.trim(), context:memoryContext()})});
    answer = result.answer;
  } catch(error) {
    answer = `I couldn't reach BackBrain's secure AI service: ${error.message}`;
  }
  askLog.unshift({q: text.trim(), a: answer});
  if (askLog.length > 20) askLog.pop();
  autoGraphFromActivity('question', text.trim());
  saveAskLog();
  speakText(answer);
  render();
}

function demoAnswerFor(question){
  const q = question.toLowerCase();
  for (const p of people) if (q.includes(p.name)) return `${p.name} is your ${p.relation}. ${p.note}`;
  if (q.includes('today') || q.includes('schedule')) return 'Today includes Yusuf’s saved activities and any events currently added to the calendar.';
  if (q.includes('remember') || q.includes('reminder')) return `You have ${inbox.length} item(s) waiting to be scheduled, including “${inbox[0]?.text || 'nothing right now'}.”`;
  return 'In this competition demo, BackBrain found your recent moments and organized them into your personal knowledge map.';
}

// ---------- voice ("hey backbrain") ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let awaitingCommand = false;
let voiceStatusText = 'voice off — press start listening';
let selectedKnowledge = 'overview';
let lastVoiceAnswer = '';

function setVoiceStatus(text){
  voiceStatusText = text;
  const el = document.getElementById('voiceStatus');
  if (el) el.textContent = text;
}

function speakText(text){
  lastVoiceAnswer = text;
  if ('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1;
    window.speechSynthesis.speak(utter);
  }
}

function voiceAction(message){
  setVoiceStatus(message);
  speakText(message);
}

function addVoiceReminder(text){
  const clean = text.trim();
  if (!clean) return voiceAction('tell me what to remember.');
  inbox.push({id: nextInboxId++, text: clean, meta: 'added by voice'});
  autoGraphFromActivity('reminder', clean);
  saveState();
  goToTab('home');
  voiceAction(`remembered: ${clean}`);
}

function addVoiceEvent(text){
  const clean = text.trim();
  if (!clean) return voiceAction('tell me the event to add.');
  const key = dateKey(selectedDay);
  if (!events[key]) events[key] = [];
  events[key].push({id: nextEventId++, text: clean, time: 'time tbd', source:'you'});
  autoGraphFromActivity('event', clean);
  saveState();
  goToTab('calendar');
  voiceAction(`added ${clean} to your calendar.`);
}

function deleteVoiceEvent(text){
  const clean = text.trim().toLowerCase();
  const key = dateKey(selectedDay);
  const match = (events[key] || []).find(e => e.text.toLowerCase().includes(clean));
  if (!match) return voiceAction(`i couldn't find ${text.trim()} on the selected day.`);
  events[key] = events[key].filter(e => e.id !== match.id);
  if (events[key].length === 0) delete events[key];
  saveState();
  render();
  voiceAction(`deleted ${match.text} from your calendar.`);
}

function handleVoiceCommand(raw){
  const text = raw.toLowerCase().trim();
  if (!text) return;
  if (text === 'turn off listening' || text === 'stop listening' || text === 'stop listening now'){
    stopListening();
    return;
  }
  if (text === 'turn on listening' || text === 'start listening'){
    startListening();
    return;
  }
  if (text === 'go home' || text === 'show home'){
    goToTab('home');
    return voiceAction('home.');
  }
  if (text.startsWith('remember ') || text.startsWith('add reminder ')){
    return addVoiceReminder(text.replace(/^add reminder |^remember /, ''));
  }
  if (text.startsWith('add event ') || text.startsWith('schedule ')){
    return addVoiceEvent(text.replace(/^add event |^schedule /, ''));
  }
  if (text.startsWith('delete event ') || text.startsWith('remove event ')){
    return deleteVoiceEvent(text.replace(/^delete event |^remove event /, ''));
  }
  if (text.includes('calendar') || text.includes('schedule')){
    goToTab('calendar');
    return voiceAction('calendar.');
  }
  if (text.includes('timeline')){
    goToTab('timeline');
    return voiceAction('timeline.');
  }
  if (text.includes('people') || text.includes('who is')){
    goToTab('people');
    return voiceAction('people.');
  }
  if (text.includes('you map') || text === 'show you' || text === 'open you' || text.includes('knowledge map')){
    goToTab('you');
    return voiceAction('your knowledge map.');
  }
  const topic = ['friends','passwords','health','schedule','memories'].find(name => text.includes(name));
  if (topic && (text.includes('show') || text.includes('open') || text.includes('tell me'))){
    selectedKnowledge = topic;
    goToTab('you');
    return voiceAction(`${topic}.`);
  }
  if (text === 'repeat that' || text === 'repeat'){
    return voiceAction(lastVoiceAnswer || 'there is nothing to repeat yet.');
  }
  askQuestion(text);
}

function handleTranscript(raw){
  let text = raw.toLowerCase().trim();
  if (!text) return;
  const wake = 'hey backbrain';
  const hasWake = text.includes(wake);
  if (hasWake) text = text.split(wake).slice(1).join(wake).trim();
  if (text === 'turn off listening' || text === 'stop listening') return handleVoiceCommand(text);
  if (awaitingCommand){
    awaitingCommand = false;
    handleVoiceCommand(text);
    return;
  }
  if (hasWake){
    if (text.length > 1) handleVoiceCommand(text);
    else {
      awaitingCommand = true;
      setVoiceStatus('listening for your command...');
    }
  }
}

function startListening(){
  if (!SpeechRecognition){
    setVoiceStatus("voice isn't supported in this browser — try chrome, over https.");
    return;
  }
  if (!recognition){
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
    recognition.onresult = (e) => {
      const last = e.results[e.results.length - 1];
      if (last.isFinal) handleTranscript(last[0].transcript);
    };
    recognition.onerror = (e) => {
      setVoiceStatus('mic error: ' + e.error);
      listening = false;
      updateMicBtn();
    };
    recognition.onend = () => { if (listening){ try{ recognition.start(); }catch(e){} } };
  }
  try{
    recognition.start();
    listening = true;
    setVoiceStatus('listening — say “hey backbrain” then a command.');
    updateMicBtn();
  }catch(e){
    setVoiceStatus('could not start the mic.');
  }
}

function stopListening(){
  listening = false;
  if (recognition) recognition.stop();
  awaitingCommand = false;
  setVoiceStatus('voice off — press start listening');
  updateMicBtn();
}

function updateMicBtn(){
  const btn = document.getElementById('micBtn');
  const stopBtn = document.getElementById('stopListeningBtn');
  if (btn){
    btn.classList.toggle('live', listening);
    btn.textContent = listening ? 'listening' : 'start listening';
  }
  if (stopBtn){
    stopBtn.disabled = !listening;
    stopBtn.textContent = 'turn off listening';
  }
}

function projectGraphPoint(point, width, height){
  const cy=Math.cos(graphCamera.yaw), sy=Math.sin(graphCamera.yaw), cp=Math.cos(graphCamera.pitch), sp=Math.sin(graphCamera.pitch);

  const z2=point.y*sp+z1*cp;

  else if(kind==='event' || kind==='reminder' || /schedule|appointment|meeting|study|homework|school|swim|taekwondo|practice/.test(lower)) target='schedule';
  else if(kind==='health' || /health|doctor|baumfolk/.test(lower)) target='health';
  else if(kind==='memory') target='memories';
  if(target){ addNodeItem(target,text,`${kind}:${graphTextId(text)}`); saveState(); return; }
  if(kind==='question' && text.trim().length>4){
    const label=text.trim().split(/\s+/).slice(0,3).join(' ');
    let node=knowledgeNodes.find(n=>n.autoKey===graphTextId(label));

    ctx.fillStyle=n.id==='overview'?colors.you:(n.color||colors.paper); ctx.strokeStyle=selected?colors.you:colors.border; ctx.lineWidth=selected?3:1.2; ctx.beginPath();ctx.arc(s.x,s.y,radius,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle=n.id==='overview'?'#082733':colors.ink;ctx.font=`${n.id==='overview'?'600 13':'600 11'}px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.label,s.x,s.y);
    if(n.id!=='overview'){ctx.fillStyle=colors.you;ctx.font='9px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';ctx.fillText(Math.round(Number(n.z)||0),s.x,s.y+radius+9);}
    ctx.restore(); item.radius=radius;
  }
  canvas._graphPoints=points;
}
function animateGraph(){
  if(currentScreen==='you' && graphAutoRotate && !graphPointer.mode){graphCamera.yaw+=.0018;drawGraph();}
  graphAnimation=requestAnimationFrame(animateGraph);
}
function graphHit(event){
  const canvas=document.getElementById('knowledgeCanvas'); if(!canvas||!canvas._graphPoints)return null; const rect=canvas.getBoundingClientRect(); const x=event.clientX-rect.left,y=event.clientY-rect.top;
  return [...canvas._graphPoints].reverse().find(item=>Math.hypot(item.screen.x-x,item.screen.y-y)<=item.radius) || null;
}
function resetGraphView(){graphCamera={yaw:.55,pitch:-.18,zoom:1,panX:0,panY:0};drawGraph();}
function wireGraph(){
  const canvas=document.getElementById('knowledgeCanvas'); if(!canvas)return;
  drawGraph();
  canvas.oncontextmenu=(event)=>event.preventDefault();
  canvas.onwheel=(event)=>{event.preventDefault();graphCamera.zoom=clamp(graphCamera.zoom*(event.deltaY<0?1.08:.92),.55,2.6);drawGraph();};
  canvas.onpointerdown=(event)=>{const hit=graphHit(event); graphPointer={mode:hit?'node':(event.shiftKey||event.button===2?'pan':'orbit'),x:event.clientX,y:event.clientY,nodeId:hit?hit.node.id:null,moved:false}; try{canvas.setPointerCapture(event.pointerId);}catch(e){} if(hit){selectedKnowledge=hit.node.id;drawGraph();renderGraphDetail();}};
  canvas.onpointermove=(event)=>{if(!graphPointer.mode)return;const dx=event.clientX-graphPointer.x,dy=event.clientY-graphPointer.y;graphPointer.moved=graphPointer.moved||Math.abs(dx)+Math.abs(dy)>2;graphPointer.x=event.clientX;graphPointer.y=event.clientY;
    if(graphPointer.mode==='node'&&graphPointer.nodeId!=='overview'){const node=nodeById(graphPointer.nodeId); if(node){node.x=clamp((Number(node.x)||50)+dx*.24,5,95);node.y=clamp((Number(node.y)||50)+dy*.24,8,92);saveState();}}
    else if(graphPointer.mode==='orbit'){graphCamera.yaw+=dx*.008;graphCamera.pitch=clamp(graphCamera.pitch+dy*.008,-1.25,1.25);}
    else if(graphPointer.mode==='pan'){graphCamera.panX+=dx;graphCamera.panY+=dy;}
    drawGraph(); if(graphPointer.mode==='node')renderGraphDetail();
  };
  canvas.onpointerup=()=>{const wasNode=graphPointer.mode==='node'&&!graphPointer.moved&&graphPointer.nodeId&&graphPointer.nodeId!=='overview';const clickedId=graphPointer.nodeId;graphPointer.mode=null;saveState();if(wasNode)openTopicCard(clickedId);};
  canvas.ondblclick=(event)=>{const hit=graphHit(event);if(hit&&hit.node.id!=='overview'){closeTopicCard();editKnowledgeNode(hit.node.id);}};
}
function renderGraphDetail(){const el=document.getElementById('graphDetail');if(!el)return;const node=nodeById(selectedKnowledge);el.innerHTML=`<strong>${escapeHtml(node?node.label:'overview')}</strong><br>${escapeHtml(nodeDetail(node))}`;}

function clamp(value, min, max){ return Math.max(min, Math.min(max, value)); }
function nodeById(id){ return knowledgeNodes.find(n => n.id === id); }
function nodeDetail(node){
  if (!node) return 'This is your private map of the things BackBrain can help you remember.';
  if (node.id === 'friends') return people.length ? `${people.length} people are in your circle: ${people.map(p => p.name).join(', ')}.` : 'No people have been added yet.';
  if (node.id === 'schedule') return `${Object.values(events).flat().length} calendar event(s) are currently saved in this browser.`;
  if (node.id === 'memories') return `${moments.length} saved moments are available in the timeline.`;
  return node.detail || 'A customizable part of your private map.';
}
function mapLineMarkup(node){
  const x = Number(node.x) || 50;
  const y = Number(node.y) || 50;
  return `<line x1="50%" y1="50%" x2="${x}%" y2="${y}%"></line>`;
}
function mapNodeMarkup(node){
  const selected = selectedKnowledge === node.id ? ' selected' : '';
  const custom = ['friends','passwords','health','schedule','memories'].includes(node.id) ? '' : ' custom';
  return `<button class="knowledge-node topic${custom}${selected}" data-knowledge="${escapeHtml(node.id)}" data-drag-node="${escapeHtml(node.id)}" style="left:${clamp(Number(node.x)||50,5,95)}%;top:${clamp(Number(node.y)||50,8,92)}%;z-index:${clamp(Number(node.z)||10,1,40)};transform:translate(-50%,-50%) translateZ(${clamp(Number(node.z)||10,0,80)}px);background:${escapeHtml(node.color || 'var(--paper)')};" title="drag to move • click to select"><span>${escapeHtml(node.label)}</span><span class="node-z">${clamp(Number(node.z)||10,0,80)}</span></button>`;
}
async function addKnowledgeNode(){
  const r = await showModal('add knowledge node', [
    {key:'label', label:'title', placeholder:'e.g. projects'},
    {key:'detail', label:'what belongs here?', placeholder:'a short description'},
    {key:'color', label:'node color', type:'color', value:'#F4FBFF'}
  ]);
  if (!r || !r.label) return;
  const id = 'node_' + nextNodeId++;
  knowledgeNodes.push({id, label:r.label, detail:r.detail || 'A new part of your map.', x:50, y:50, z:16, color:r.color || '#F4FBFF', locked:false});
  selectedKnowledge = id;
  saveState();
  render();
}
async function editKnowledgeNode(id){
  const node = nodeById(id);
  if (!node) return;
  const r = await showModal('edit knowledge node', [
    {key:'label', label:'title', value:node.label},
    {key:'detail', label:'what belongs here?', value:node.detail},
    {key:'color', label:'node color', type:'color', value:node.color || '#F4FBFF'}
  ]);
  if (!r || !r.label) return;
  node.label = r.label;
  node.detail = r.detail;
  node.color = r.color || node.color;
  saveState();
  render();
}
function removeKnowledgeNode(id){
  const node = nodeById(id);
  if (!node) return;
  knowledgeNodes = knowledgeNodes.filter(n => n.id !== id);
  selectedKnowledge = 'overview';
  saveState();
  render();
}
function resetKnowledgeLayout(){
  const defaults = {friends:[16,20,10],passwords:[78,20,14],health:[16,76,8],schedule:[78,76,12],memories:[50,11,18]};
  knowledgeNodes.forEach(n => { const d = defaults[n.id]; if (d){ n.x=d[0]; n.y=d[1]; n.z=d[2]; } });
  saveState();
  render();
}
function updateNodePosition(id, event){
  const node = nodeById(id);
  const map = document.querySelector('.knowledge-map');
  if (!node || !map) return;
  const rect = map.getBoundingClientRect();
  node.x = clamp(((event.clientX - rect.left) / rect.width) * 100, 5, 95);
  node.y = clamp(((event.clientY - rect.top) / rect.height) * 100, 8, 92);
  const el = document.querySelector(`[data-drag-node="${CSS.escape(id)}"]`);
  if (el){ el.style.left = `${node.x}%`; el.style.top = `${node.y}%`; }
  saveState();
  const lines = document.querySelectorAll('.knowledge-links line');
  const index = knowledgeNodes.findIndex(n => n.id === id);
  if (lines[index]){ lines[index].setAttribute('x2', `${node.x}%`); lines[index].setAttribute('y2', `${node.y}%`); }
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s == null ? '' : s;
  return div.innerHTML;
}

// ---------- wire events per screen ----------
function wireScreenEvents(){
  const authBtn = document.getElementById('authBtn');
  if (authBtn) authBtn.onclick = async () => {
    if (!supabaseClient) return alert('Supabase is not configured yet. Add SUPABASE_URL and SUPABASE_ANON_KEY to the deployment.');
    if (authUser){ await supabaseClient.auth.signOut(); return; }
    const r = await showModal('sign in to backbrain', [{key:'email', label:'email', type:'email', placeholder:'you@example.com'}]);
    if (!r || !r.email) return;
    const result = await supabaseClient.auth.signInWithOtp({email:r.email, options:{emailRedirectTo:window.location.origin}});
    if (result.error) alert(result.error.message); else alert('Check your email for a secure sign-in link.');
  };
  const askBtn = document.getElementById('askBtn');
  const askInput = document.getElementById('askInput');
  if (askBtn) askBtn.onclick = () => { askQuestion(askInput.value); askInput.value=''; };
  if (askInput) askInput.onkeydown = (e) => { if (e.key==='Enter'){ askQuestion(askInput.value); askInput.value=''; } };

  const addReminderBtn = document.getElementById('addReminderBtn');
  if (addReminderBtn) addReminderBtn.onclick = addReminder;
  document.querySelectorAll('[data-edit-reminder]').forEach(b => b.onclick = () => editReminder(parseInt(b.dataset.editReminder)));
  document.querySelectorAll('[data-confirm-reminder]').forEach(b => b.onclick = () => confirmReminder(parseInt(b.dataset.confirmReminder)));

  document.querySelectorAll('[data-day]').forEach(cell => cell.onclick = () => { selectedDay = dateOnly(new Date(cell.dataset.day)); render(); });
  const prevWeekBtn = document.getElementById('prevWeekBtn');
  const nextWeekBtn = document.getElementById('nextWeekBtn');
  if (prevWeekBtn) prevWeekBtn.onclick = () => { weekStart.setDate(weekStart.getDate()-7); selectedDay = new Date(weekStart); render(); };
  if (nextWeekBtn) nextWeekBtn.onclick = () => { weekStart.setDate(weekStart.getDate()+7); selectedDay = new Date(weekStart); render(); };
  const addEventBtn = document.getElementById('addEventBtn');
  if (addEventBtn) addEventBtn.onclick = addEvent;
  document.querySelectorAll('[data-remove-event]').forEach(b => b.onclick = () => removeEvent(parseInt(b.dataset.removeEvent)));

  const addPersonBtn = document.getElementById('addPersonBtn');
  if (addPersonBtn) addPersonBtn.onclick = addPerson;
  document.querySelectorAll('[data-edit-person]').forEach(b => b.onclick = () => editPerson(parseInt(b.dataset.editPerson)));
  document.querySelectorAll('[data-remove-person]').forEach(b => b.onclick = () => removePerson(parseInt(b.dataset.removePerson)));
  document.querySelectorAll('[data-knowledge]').forEach(b => b.onclick = () => { selectedKnowledge = b.dataset.knowledge; render(); });

  const addKnowledgeBtn = document.getElementById('addKnowledgeBtn');
  if (addKnowledgeBtn) addKnowledgeBtn.onclick = addKnowledgeNode;
  const resetMapBtn = document.getElementById('resetMapBtn');
  if (resetMapBtn) resetMapBtn.onclick = () => { resetGraphView(); resetKnowledgeLayout(); };
  const toggleAutoRotateBtn = document.getElementById('toggleAutoRotateBtn');
  if (toggleAutoRotateBtn) toggleAutoRotateBtn.onclick = () => { graphAutoRotate = !graphAutoRotate; render(); };
  if (document.getElementById('knowledgeCanvas')) wireGraph();
  const editKnowledgeBtn = document.getElementById('editKnowledgeBtn');
  if (editKnowledgeBtn && selectedKnowledge !== 'overview') editKnowledgeBtn.onclick = () => editKnowledgeNode(selectedKnowledge);
  const removeKnowledgeBtn = document.getElementById('removeKnowledgeBtn');
  if (removeKnowledgeBtn && selectedKnowledge !== 'overview') removeKnowledgeBtn.onclick = () => removeKnowledgeNode(selectedKnowledge);
  const subRow = document.getElementById('subRow');
  if (subRow) subRow.onclick = () => goToScreen('subscription');
  const autoGraphSwitch = document.getElementById('autoGraphSwitch');
  if (autoGraphSwitch) autoGraphSwitch.onclick = () => { graphAutoNodes = !graphAutoNodes; saveState(); render(); };
  const themeSwitch = document.getElementById('themeSwitch');
  if (themeSwitch) themeSwitch.onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); saveState(); render(); };
  const notifSwitch = document.getElementById('notifSwitch');
  if (notifSwitch) notifSwitch.onclick = () => { notificationsEnabled = !notificationsEnabled; saveState(); render(); };
  const caregiverSwitch = document.getElementById('caregiverSwitch');
  if (caregiverSwitch) caregiverSwitch.onclick = () => { caregiverShare = !caregiverShare; saveState(); render(); };
  const mockDataBtn = document.getElementById('mockDataBtn');
  if (mockDataBtn) mockDataBtn.onclick = () => {
    mockDataEnabled = !mockDataEnabled;
    if (mockDataEnabled) loadPersonalizedMockData(); else clearLocalData();
    applyTheme(); saveState(); render();
  };
  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.onclick = () => { clearLocalData(); applyTheme(); saveState(); render(); };
  const subscribeBtn = document.getElementById('subscribeBtn');
  if (subscribeBtn) subscribeBtn.onclick = async () => {
    if (mockDataEnabled) return;
    const email = document.getElementById('subEmail').value.trim();
    const errEl = document.getElementById('subError');
    if (!email || !email.includes('@')){
      errEl.textContent = 'enter a valid email first.';
      errEl.style.display = 'block';
      return;
    }
    subscribeBtn.disabled = true;
    subscribeBtn.textContent = 'opening secure checkout…';
    try {
      const result = await apiRequest('/api/stripe/create-checkout-session', {method:'POST', body:JSON.stringify({email})});
      if (!result.url) throw new Error('Stripe did not return a checkout URL.');
      window.location.assign(result.url);
    } catch(error) {
      errEl.textContent = error.message;
      errEl.style.display = 'block';
      subscribeBtn.disabled = false;
      subscribeBtn.textContent = 'subscribe — $19/month';
    }
  };
  const cancelSubBtn = document.getElementById('cancelSubBtn');
  if (cancelSubBtn) cancelSubBtn.onclick = () => { isSubscribed = false; saveState(); render(); };
}

// ---------- top-level wiring ----------
document.getElementById('settingsBtn').onclick = () => goToScreen('settings');
document.getElementById('backBtn').onclick = () => {
  if (currentScreen === 'subscription') goToScreen('settings');
  else goToScreen(currentTab);
};
document.querySelectorAll('#bottomNav button').forEach(btn => btn.onclick = () => goToTab(btn.dataset.tab));
document.getElementById('micBtn').onclick = () => { listening ? stopListening() : startListening(); };
document.getElementById('stopListeningBtn').onclick = () => stopListening();
window.addEventListener('storage', (event) => { if (event.key === STATE_KEY){ loadState(); applyTheme(); render(); } });

applyTheme();
render();
if (!graphAnimation) animateGraph();
window.addEventListener('resize', () => { if (currentScreen === 'you') drawGraph(); });

(async function initializeSupabase(){
  if (!window.supabase) return;
  try {
    const config = await fetch('/api/config').then(r => r.ok ? r.json() : null);
    if (!config) return;
    supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
    const current = await supabaseClient.auth.getUser();
    authUser = current.data.user || null;
    supabaseClient.auth.onAuthStateChange((_event, session) => { authUser = session?.user || null; render(); });
    render();
  } catch(error) { console.warn('Supabase initialization failed:', error.message); }
})();

// Stripe redirects back here after Checkout. Verify the session server-side before
// changing the local display state; a local boolean is never proof of payment.
(async function verifyCheckoutReturn(){
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  if (params.get('checkout') !== 'success' || !sessionId) return;
  try {
    const result = await apiRequest(`/api/stripe/session-status?session_id=${encodeURIComponent(sessionId)}`);
    if (result.paid && result.subscriptionStatus && ['active','trialing'].includes(result.subscriptionStatus)) {
      isSubscribed = true;
      saveState();
      render();
    }
  } catch(error) {
    console.warn('Could not verify Stripe checkout return:', error.message);
  } finally {
    history.replaceState({}, document.title, window.location.pathname);
  }
})();
</script>
